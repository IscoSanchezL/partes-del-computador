<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conoce el computador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F4FB; --card:#FFFFFF; --ink:#1F2A44; --soft:#4F5B78;
  --accent:#7B5CD6; --sun:#FFC93C; --leaf:#3DBE7A; --tomato:#FF6B5B;
  --wall:#CFEAF6; --floor:#EBD9B4; --tint:#F1F8FC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#142033; --card:#1E2D47; --ink:#F1F5FF; --soft:#B9C4DD;
    --wall:#26405F; --floor:#3A3326; --tint:#18263D;
  }
}
:root[data-theme="dark"]{
  --bg:#142033; --card:#1E2D47; --ink:#F1F5FF; --soft:#B9C4DD;
  --wall:#26405F; --floor:#3A3326; --tint:#18263D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif; font-size:22px; line-height:1.45}
.wrap{max-width:1240px; margin:0 auto; padding:16px 16px 36px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
h1{font-size:clamp(32px,4.6vw,52px); line-height:1.05; margin:0; letter-spacing:-.5px}
h1 span{display:inline-block}
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.tab,.btn{font:inherit; font-weight:700; font-size:21px; cursor:pointer; border:4px solid var(--ink);
  background:var(--card); color:var(--ink); padding:10px 18px; border-radius:999px; min-height:58px}
.btn{border-radius:18px; background:var(--leaf); color:#10311F; font-size:22px; min-height:62px; padding:12px 22px}
.btn.alt{background:var(--card); color:var(--ink)}
.btn.sun{background:var(--sun); color:#1F2A44}
.starcount{font-weight:700; font-size:24px; background:var(--sun); color:#1F2A44; border:4px solid var(--ink); border-radius:999px; padding:8px 18px}
button:focus-visible,input:focus-visible,.part:focus-visible{outline:4px dashed var(--accent); outline-offset:3px}
button:disabled{opacity:.45; cursor:default}

main{display:grid; gap:18px; align-items:start}
main.withscene{grid-template-columns:1.6fr 1fr}
main.full{grid-template-columns:1fr}
main.full .scene{display:none}
@media (max-width:920px){ main.withscene{grid-template-columns:1fr} }

.scene{background:var(--card); border:4px solid var(--ink); border-radius:28px; overflow:hidden}
.caption{font-weight:700; font-size:24px; padding:10px 18px; border-bottom:4px solid var(--ink); background:var(--tint)}
.scene svg{display:block; width:100%; height:auto; max-width:100%}
.wall{fill:var(--wall)} .floor{fill:var(--floor)}

.part{cursor:pointer}
.part .body{transform-box:fill-box; transform-origin:50% 100%}
.part .halo{opacity:0; transition:opacity .15s}
.part:hover .halo,.part:focus-visible .halo{opacity:.55}
.part.sel .halo{opacity:1}
.part.sel .body{animation:hop .55s ease}
.part.no .body{animation:shake .45s ease}
.part .check{opacity:0; transition:opacity .2s}
.part.seen .check{opacity:1}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) scale(1.04)}65%{transform:translateY(0)}82%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.eye{transform-box:fill-box; transform-origin:center; animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.panel{background:var(--card); border:4px solid var(--ink); border-radius:28px; padding:22px; min-height:380px}
.emoji{font-size:80px; line-height:1; margin-bottom:6px}
.pname{font-size:clamp(38px,4.8vw,54px); line-height:1.05; margin:0 0 10px; font-weight:700}
.say{font-size:26px; margin:0 0 14px}
.care{background:var(--tint); border-radius:18px; padding:12px 16px; margin:0 0 16px; color:var(--soft); font-size:21px}
.care b{color:var(--ink)}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.hint{font-size:26px; margin:0 0 8px}
.small{font-size:19px; color:var(--soft); margin:0 0 6px}
.progress{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; align-items:center; color:var(--soft); font-size:19px}
.dot{width:30px; height:30px; border-radius:50%; border:3px solid var(--ink); display:grid; place-items:center; font-size:16px; color:#10311F}
.dot.on{background:var(--leaf)}
.target{font-size:clamp(40px,5.6vw,60px); font-weight:700; line-height:1.08; margin:4px 0 12px}
.riddle{font-size:clamp(28px,3.4vw,36px); font-weight:700; line-height:1.25; margin:4px 0 12px}
.where{display:inline-block; background:var(--tint); border-radius:999px; padding:4px 14px; font-size:20px; margin-bottom:6px}
.stars{font-size:34px; letter-spacing:3px; min-height:48px; margin:8px 0 12px; word-break:break-all}
.feedback{font-size:25px; min-height:38px; margin:0 0 14px; font-weight:700}
.feedback.good{color:#23874F} .feedback.try{color:#C94A3D}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .feedback.good{color:#6FE0A4} :root:not([data-theme="light"]) .feedback.try{color:#FF9C90} }

/* mapa de misiones */
.maphead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:10px; margin-bottom:14px}
.maphead h2{font-size:clamp(34px,4.4vw,48px); margin:0; line-height:1.05}
.missions{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px}
.mcard{font:inherit; color:var(--ink); text-align:left; cursor:pointer; background:var(--tint);
  border:4px solid var(--ink); border-radius:24px; padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; min-height:130px}
.mcard .num{grid-row:span 3; width:54px; height:54px; border-radius:50%; background:var(--card); border:4px solid var(--ink); display:grid; place-items:center; font-weight:700; font-size:26px}
.mcard .me{font-size:34px; line-height:1}
.mcard .mt{font-weight:700; font-size:22px; line-height:1.2}
.mcard .ms{font-size:18px; color:var(--soft)}
.mcard.done{background:#DDF5E8} .mcard.done .num{background:var(--leaf); color:#10311F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mcard.done{background:#1D3B33} }
.mcard.next{border-color:var(--accent); box-shadow:0 0 0 5px var(--sun)}
.mcard.locked{opacity:.6; cursor:default}
.mcard.prize{background:#FFF1C2} .mcard.prize .num{background:var(--sun); color:#1F2A44}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mcard.prize{background:#3A3420} }
.reset{margin-top:18px; font:inherit; font-size:17px; background:none; border:none; color:var(--soft); text-decoration:underline; cursor:pointer; padding:8px}

/* preguntas con opciones */
.qcard{text-align:center; max-width:880px; margin:0 auto}
.qemoji{font-size:96px; line-height:1}
.qtext{font-size:clamp(30px,4vw,44px); font-weight:700; line-height:1.2; margin:8px 0 18px}
.choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:16px}
.choice{font:inherit; font-weight:700; font-size:24px; cursor:pointer; color:var(--ink); background:var(--tint);
  border:4px solid var(--ink); border-radius:24px; padding:14px; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px}
.choice .ce{font-size:60px; line-height:1}
.choice.right{background:var(--leaf); color:#10311F}
.choice.wrong{animation:shake .45s ease}
.why{font-size:24px; margin:0 0 14px}

/* diploma */
.diploma{max-width:760px; margin:18px auto 0; text-align:center; background:#FFFDF4; color:#1F2A44;
  border:10px double #D9A21E; border-radius:24px; padding:26px 22px}
.diploma .big{font-size:clamp(34px,5vw,52px); font-weight:700; line-height:1.1; margin:4px 0}
.diploma .nm{font-size:clamp(34px,5vw,50px); font-weight:700; color:#6A4BC4; border-bottom:4px solid #1F2A44; display:inline-block; min-width:60%; padding:0 10px; margin:8px 0 12px}
.namebox{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
.namebox input{font:inherit; font-size:28px; padding:10px 16px; border:4px solid var(--ink); border-radius:16px; width:min(420px,100%); background:var(--card); color:var(--ink)}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5}
.confetti i{position:absolute; top:-30px; width:14px; height:20px; border-radius:4px; animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){
  .part.sel .body,.part.no .body,.eye,.choice.wrong{animation:none}
  .confetti{display:none}
}
</style>
</head>

/* ---------- sonido y voz ---------- */
let soundOn=true, esVoice=null, speakToken=0, actx=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices();
  esVoice=v.find(x=>x.lang==='es-CO')||v.find(x=>x.lang==='es-MX')||v.find(x=>x.lang==='es-US')||v.find(x=>x.lang&&x.lang.startsWith('es'))||null; }
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,cb){
  const my=++speakToken; let fired=false;
  const done=()=>{ if(fired||my!==speakToken) return; fired=true; cb&&cb(); };
  if(!soundOn||!('speechSynthesis' in window)){ if(cb) setTimeout(done,1400); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=esVoice?esVoice.lang:'es-ES'; if(esVoice) u.voice=esVoice;
    u.rate=.88; u.pitch=1.1; u.onend=done; u.onerror=()=>{};
    speechSynthesis.speak(u);
    if(cb) setTimeout(done,1800+t.length*85);
  }catch(e){ if(cb) setTimeout(done,1400); }
}
function hush(){speakToken++; if('speechSynthesis' in window) try{speechSynthesis.cancel()}catch(e){}}
function tone(freqs,type){
  if(!soundOn) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type||'sine'; o.frequency.value=f;
      const s=t+i*.11; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.16,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.24);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+.28);});
  }catch(e){}
}
const ding=()=>tone([660,880,1175]), oops=()=>tone([330,247],'triangle');

    p.style.animationDelay=(Math.random()*.5)+'s'; p.style.animationDuration=(1.4+Math.random()*1.3)+'s'; box.appendChild(p);}

    </div>
    <button class="reset" id="reset">Borrar el progreso para un nuevo estudiante</button>`;
  panel.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMission(+b.dataset.m));
  $('#prize').onclick=()=>{ if(doneCount()===MISSIONS.length) showDiploma(); else speak('Primero cumple las ocho misiones. ¡Tú puedes!'); };
  const r=$('#reset'); r.onclick=()=>{ if(r.dataset.sure){ state=fresh(); save(); paintStars(); showMap(); } else { r.dataset.sure=1; r.textContent='¿Seguro? Toca otra vez para borrar'; } };
}
$('#bMap').onclick=showMap;

function startMission(i){
  run++; hush(); clearMarks(true);
  const m=MISSIONS[i];
  ({explore:runExplore,find:runFind,riddle:runRiddle,uso:runUso,cual:runCual,cuido:runCuido})[m.type](m,i);
}
function finishMission(i,stars){
  run++; onTap=null;
  const m=MISSIONS[i];
  state.done[m.id]=true;
  if(m.max) state.stars[m.id]=Math.max(state.stars[m.id]||0,stars);
  save(); paintStars(); confetti(); ding();
  const next=MISSIONS.findIndex(x=>!state.done[x.id]);
  const all=next===-1;
  layout(false);
  panel.innerHTML=`<div class="qcard">
    <div class="qemoji">🏅</div>
    <h2 class="pname">¡Misión cumplida!</h2>
    <p class="say">${m.title}</p>
    ${m.max?`<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(m.max-stars)}</div><p class="say">Ganaste ${stars} de ${m.max} estrellas.</p>`:''}
    <div class="row" style="justify-content:center">
      ${all?`<button class="btn sun" id="goD">📜 Ver mi diploma</button>`:`<button class="btn" id="goN">▶️ Siguiente misión</button>`}
      <button class="btn alt" id="goR">🔁 Repetir</button>
      <button class="btn alt" id="goM">🗺️ Misiones</button>
    </div></div>`;
  speak(all?'¡Increíble! Cumpliste todas las misiones. Ganaste tu diploma.':`¡Misión cumplida!${m.max?` Ganaste ${stars} estrellas.`:''}`);
  if(all) $('#goD').onclick=showDiploma; else $('#goN').onclick=()=>startMission(next);
  $('#goR').onclick=()=>startMission(i); $('#goM').onclick=showMap;
}
function header(i,extra){ return `<p class="small">Misión ${i+1} de 8: ${MISSIONS[i].title}${extra?`. ${extra}`:''}</p>`; }

/* ---------- misión: explorar ---------- */
function runExplore(m,i){
  layout(true); setScene(m.scene);
  const list=ids(m.scene), seen=new Set();
  const dots=()=>`<div class="progress">${list.map(id=>`<span class="dot ${seen.has(id)?'on':''}">${seen.has(id)?'✓':''}</span>`).join('')}<span>Conoces ${seen.size} de ${list.length}</span></div>`;
  panel.innerHTML=`${header(i)}<div class="emoji">👆</div>
    <p class="hint"><b>Toca cada parte del ${m.scene==='mesa'?'computador de mesa':'portátil'}</b> para saber cómo se llama y para qué sirve.</p>
    <p class="small">Busca las ${list.length} partes. Algunas son muy pequeñitas. 🔎</p>${dots()}`;
  speak(`Toca cada parte del ${m.scene==='mesa'?'computador de mesa':'portátil'}. Busca las ${list.length} partes.`);
  onTap=id=>{
    if(PARTS[id].scene!==m.scene) return;
    const p=PARTS[id];
    clearMarks(false); replay(groups[id],'sel');
    seen.add(id); groups[id].classList.add('seen');
    const allSeen=seen.size===list.length;
    panel.innerHTML=`${header(i)}<div class="emoji">${p.emoji}</div><h2 class="pname">${p.name}</h2>
      <p class="say">${p.say}</p><p class="care"><b>Yo lo cuido:</b> ${p.care}</p>
      <div class="row"><button class="btn alt" id="listen">🔊 Escuchar otra vez</button>${allSeen?`<button class="btn" id="fin">✅ Terminar misión</button>`:''}</div>${dots()}`;
    const text=`${spokenName(id)}. ${p.say} ${p.care}`;
    $('#listen').onclick=()=>speak(text);
    if(allSeen){ $('#fin').onclick=()=>finishMission(i,0); speak(text+' ¡Ya conoces todas las partes!'); }
    else speak(text);
  };
}

/* ---------- misiones: tocar en la escena ---------- */
function runTapGame(i,rounds,render){
  layout(true);
  let k=0, stars=0, missed=false, busy=false;
  function next(){
    clearMarks(false); busy=false; missed=false;
    if(k>=rounds.length) return finishMission(i,stars);
    const r=rounds[k]; setScene(PARTS[r.t].scene);
    panel.innerHTML=`${header(i,`Pregunta ${k+1} de ${rounds.length}`)}${render(r)}
      <p class="feedback" id="fb"></p><div class="stars">${'⭐'.repeat(stars)}</div>
      <div class="row"><button class="btn alt" id="again">🔊 Repetir</button></div>`;
    $('#again').onclick=()=>{ if(!busy) speak(r.speak); };
    speak(r.speak);
  }
  onTap=id=>{
    if(busy) return; const r=rounds[k]; const fb=$('#fb');
    if(PARTS[id].scene!==PARTS[r.t].scene) return;
    if(id===r.t){
      busy=true; if(!missed) stars++; ding(); replay(groups[id],'sel');
      fb.className='feedback good'; fb.textContent=`¡Muy bien! 🎉 ${thatIs(id)}.`;
      panel.querySelector('.stars').textContent='⭐'.repeat(stars);
      $('#again').disabled=true;
      speak(`¡Muy bien! ${thatIs(id)}.`,()=>later(()=>{k++; next();},400));
    }else{
      missed=true; oops(); replay(groups[id],'no');
      fb.className='feedback try'; fb.textContent=`${thatIs(id)}. ¡Intenta otra vez!`;
      speak(`${thatIs(id)}. ¡Intenta otra vez!`);
    }
  };
  next();
}
function runFind(m,i){
  setScene(m.scene);
  const rounds=shuffle(ids(m.scene)).map(t=>({t,speak:`Toca ${PARTS[t].art}.`}));
  runTapGame(i,rounds,r=>`<p class="hint">Busca y toca:</p><div class="target">${PARTS[r.t].emoji} ${PARTS[r.t].name.replace(' (CPU)','')}</div>`);
}
function runRiddle(m,i){
  const mesa=shuffle(RIDDLES.filter(r=>PARTS[r.t].scene==='mesa')), port=shuffle(RIDDLES.filter(r=>PARTS[r.t].scene==='portatil'));
  const mixed=[]; while(mesa.length||port.length){ if(mesa.length) mixed.push(mesa.shift()); if(mesa.length) mixed.push(mesa.shift()); if(port.length) mixed.push(port.shift()); }
  const rounds=mixed.map(r=>({t:r.t,q:r.q,speak:r.q}));
  runTapGame(i,rounds,r=>`<span class="where">${PARTS[r.t].scene==='mesa'?'🖥️ Busca en el computador de mesa':'💻 Busca en el portátil'}</span>
    <div class="emoji">🤔</div><p class="riddle">${r.q}</p>`);
}

/* ---------- misiones: escoger una opción ---------- */
function runChoice(i,items,getOpts,question,spokenQ,getWhy){
  layout(false);
  let k=0, stars=0, missed=false, locked=false;
  function next(){
    missed=false; locked=false;
    if(k>=items.length) return finishMission(i,stars);
    const it=items[k], opts=getOpts(it);
    panel.innerHTML=`<div class="qcard">${header(i,`Pregunta ${k+1} de ${items.length}`)}
      <div class="qemoji">${it.e}</div><p class="qtext">${question(it)}</p>
      <div class="choices">${opts.map((o,j)=>`<button class="choice" data-j="${j}"><span class="ce">${o.e}</span>${o.l}</button>`).join('')}</div>
      <p class="feedback" id="fb"></p><p class="why" id="why"></p>
      <div class="stars">${'⭐'.repeat(stars)}</div>
      <div class="row" style="justify-content:center"><button class="btn alt" id="again">🔊 Repetir</button><button class="btn" id="nx" hidden>➡️ Siguiente</button></div></div>`;
    $('#again').onclick=()=>speak(spokenQ(it,opts));
    $('#nx').onclick=()=>{k++; next();};
    panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(locked) return; const o=opts[+b.dataset.j]; const fb=$('#fb');
      if(o.v===it.a){
        locked=true; if(!missed) stars++; ding(); b.classList.add('right');
        panel.querySelectorAll('.choice').forEach(x=>{ if(x!==b) x.disabled=true; });
        fb.className='feedback good'; fb.textContent='¡Muy bien! 🎉';
        const w=getWhy(it); $('#why').textContent=w;
        panel.querySelector('.stars').textContent='⭐'.repeat(stars);
        $('#nx').hidden=false; $('#nx').focus();
        speak(`¡Muy bien! ${w}`);
      }else{
        missed=true; oops(); b.disabled=true; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        fb.className='feedback try'; fb.textContent='¡Casi! Intenta otra vez.';
        speak('¡Casi! Intenta otra vez.');
      }
    });
    speak(spokenQ(it,opts));
  }
  next();
}
function runUso(m,i){
  runChoice(i,shuffle(USO),
    it=>shuffle(it.o).map(id=>({v:id,e:PARTS[id].emoji,l:PARTS[id].name.replace(' (CPU)','')})),
    it=>`${it.q}. ¿Qué uso?`,
    (it,opts)=>`${it.q}. ¿Qué uso? ¿${opts.map(o=>o.l).join(', o ')}?`,
    it=>`${PARTS[it.a].name.replace(' (CPU)','')}: ${PARTS[it.a].say}`);
}
function runCual(m,i){
  runChoice(i,shuffle(CUAL),()=>CUAL_OPTS,
    it=>it.q,
    it=>`${it.q}. ¿Es del computador de mesa, del portátil, o de los dos?`,
    it=>it.why);
}
function runCuido(m,i){
  runChoice(i,shuffle(CUIDO),()=>CUIDO_OPTS,
    it=>it.q,
    it=>`${it.q}. ¿Está bien hecho, o no se hace?`,
    it=>it.why);
}

/* ---------- diploma ---------- */
function showDiploma(){
  run++; hush(); onTap=null; layout(false);
  const date=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  panel.innerHTML=`<div class="qcard">
    <p class="hint"><b>Escribe tu nombre</b> para tu diploma:</p>
    <div class="namebox"><input id="nm" maxlength="40" autocomplete="off" value="${esc(state.name||'')}" aria-label="Tu nombre"><button class="btn alt" id="goM">🗺️ Misiones</button></div>
    <div class="diploma">
      <div style="font-size:64px;line-height:1">🏆</div>
      <div class="big">Diploma de experto en computadores</div>
      <p style="margin:6px 0 0;font-size:22px">Se entrega con orgullo a</p>
      <div class="nm" id="dn">${esc(state.name||'') || '&nbsp;'}</div>
      <p style="font-size:22px;margin:0 0 10px">por conocer las partes del computador de mesa y del portátil, y aprender a cuidarlos.</p>
      <div style="font-size:30px;font-weight:700">⭐ ${totalStars()} estrellas</div>
      <p style="font-size:18px;margin:10px 0 0">Clase de Tecnología de grado 1, GI School. ${date}</p>
    </div></div>`;
  const nm=$('#nm');
  nm.oninput=()=>{ state.name=nm.value; save(); $('#dn').innerHTML=esc(nm.value)||'&nbsp;'; };
  $('#goM').onclick=showMap;
  confetti(); ding();
  speak('¡Felicitaciones! Eres experto en computadores. Escribe tu nombre en el diploma.');
}

paintStars();
showMap();
</script>
